server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include standard Nginx MIME types and register 3D glTF/GLB types
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    # Enable Gzip compression for fast asset & 3D model delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        model/gltf-binary
        model/gltf+json
        application/octet-stream;

    # Cache 3D models with long-lived headers while supporting live reload if swapped
    location /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Cache Vite fingerprinted static assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
